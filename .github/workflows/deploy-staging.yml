name: Deploy to Staging

on:
  push:
    branches: [main]

env:
  GCP_PROJECT_ID: soundsage-staging        # TODO: replace with your staging project ID
  GCP_REGION: us-central1
  CLOUD_RUN_SERVICE: soundsage-web
  CLOUD_SQL_INSTANCE: soundsage-staging    # TODO: replace with full instance connection name
                                           #       format: PROJECT:REGION:INSTANCE_NAME
  AR_REPO: soundsage                       # TODO: create Artifact Registry repo before first deploy:
                                           #   gcloud artifacts repositories create soundsage \
                                           #     --repository-format=docker --location=us-central1

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for Workload Identity Federation

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          # TODO: create WIF pool + provider, then set these secrets in GitHub:
          #   Settings → Secrets and variables → Actions
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push container image
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/soundsage-web:${{ github.sha }}
        run: |
          gcloud builds submit \
            --tag "$IMAGE" \
            --project "${{ env.GCP_PROJECT_ID }}"

      - name: Deploy to Cloud Run
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/soundsage-web:${{ github.sha }}
        run: |
          gcloud run deploy ${{ env.CLOUD_RUN_SERVICE }} \
            --image "$IMAGE" \
            --region "${{ env.GCP_REGION }}" \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --platform managed \
            --no-allow-unauthenticated \
            --add-cloudsql-instances "${{ env.GCP_PROJECT_ID }}:${{ env.GCP_REGION }}:${{ env.CLOUD_SQL_INSTANCE }}" \
            --set-secrets "\
              DATABASE_URL=DATABASE_URL:latest,\
              NEXTAUTH_URL=NEXTAUTH_URL:latest,\
              NEXTAUTH_SECRET=NEXTAUTH_SECRET:latest,\
              GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest,\
              GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest,\
              SPOTIFY_CLIENT_ID=SPOTIFY_CLIENT_ID:latest,\
              SPOTIFY_CLIENT_SECRET=SPOTIFY_CLIENT_SECRET:latest,\
              SPOTIFY_REDIRECT_URI=SPOTIFY_REDIRECT_URI:latest,\
              TOKEN_ENCRYPTION_KEY=TOKEN_ENCRYPTION_KEY:latest,\
              SENTRY_DSN=SENTRY_DSN:latest,\
              NEXT_PUBLIC_SENTRY_DSN=NEXT_PUBLIC_SENTRY_DSN:latest,\
              REDIS_URL=REDIS_URL:latest" \
            --min-instances 0 \
            --max-instances 10 \
            --memory 512Mi \
            --cpu 1 \
            --timeout 60 \
            --service-account "${{ secrets.WIF_SERVICE_ACCOUNT }}"

  migrate:
    name: Run database migrations
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # The `migrate` Cloud Run Job runs `prisma migrate deploy` on startup.
      # Create it once before the first deploy:
      #   gcloud run jobs create migrate \
      #     --image IMAGE \
      #     --region us-central1 \
      #     --add-cloudsql-instances PROJECT:REGION:INSTANCE \
      #     --set-secrets DATABASE_URL=DATABASE_URL:latest \
      #     --command npx --args "prisma,migrate,deploy"
      - name: Execute migration job
        run: |
          gcloud run jobs execute migrate \
            --region "${{ env.GCP_REGION }}" \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --wait
